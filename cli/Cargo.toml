[package]
name = "impa"
version = "0.1.0"
edition = "2024"
description = "Reviews technical docs against the code in a lean, locked headless Claude"
license = "MIT"
publish = false

[[bin]]
name = "impa"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
